<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flores para ti 🌷🌹🌻</title>
<style>
  :root{
    --wine-deep:#3a0a26;
    --wine-mid:#7c1452;
    --wine-bright:#c81e6b;
    --cream:#faf2e4;
    --cream-edge:#efe1c8;
    --ink:#523722;
    --ink-soft:#8a6f55;
    --trunk-dark:#5c3413;
    --trunk-light:#8a5a26;
    --rose-1:#9c1238;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(circle at 28% 18%, var(--wine-bright), transparent 58%),
      radial-gradient(circle at 82% 82%, #e23a86, transparent 55%),
      linear-gradient(160deg, var(--wine-mid), var(--wine-deep) 72%);
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow:hidden;
    padding:28px 14px;
  }

  /* ---------- floating background hearts ---------- */
  .bg-hearts{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .bg-heart{
    position:absolute;
    color:#ff8fc0;
    opacity:.16;
    animation:floatUp linear infinite;
    user-select:none;
  }
  @keyframes floatUp{
    0%{transform:translateY(0) rotate(0deg);}
    100%{transform:translateY(-115vh) rotate(18deg);}
  }

  /* ---------- card ---------- */
  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:420px;
    background:linear-gradient(180deg,var(--cream),var(--cream-edge));
    border-radius:32px;
    box-shadow:0 30px 70px -22px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.5);
    padding:40px 26px 28px;
    overflow:hidden;
  }

  .scene{
    position:relative;
    height:280px;
    margin-bottom:6px;
  }

  .tree-svg{position:absolute; left:50%; bottom:14px; transform:translateX(-50%); overflow:visible;}

  .branch{
    fill:none;
    stroke:var(--trunk-dark);
    stroke-width:3.4;
    stroke-linecap:round;
    stroke-dasharray:200;
    stroke-dashoffset:200;
    animation:draw 1s ease forwards;
  }
  .trunk-shape{
    fill:url(#trunkGrad);
    transform-origin:84px 170px;
    transform:scaleY(0);
    animation:growTrunk .85s ease-out forwards;
  }
  @keyframes growTrunk{ to{transform:scaleY(1);} }
  @keyframes draw{ to{stroke-dashoffset:0;} }

  .flowers{
    position:absolute; left:50%; transform:translateX(-50%);
    width:250px; height:226px; bottom:74px;
  }
  .flower{
    position:absolute;
    opacity:0;
    transform:translate(-50%,-50%) scale(.15) rotate(0deg);
    animation:bloom .5s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  .flower svg{display:block; width:100%; height:100%;}
  @keyframes bloom{ to{opacity:1; transform:translate(-50%,-50%) scale(1) rotate(var(--rot,0deg));} }

  .ground{
    position:absolute; left:6%; right:6%; bottom:12px;
    height:1px; background:var(--ink-soft); opacity:.45;
  }

  .petals{position:absolute; inset:0; overflow:hidden; pointer-events:none;}
  .petal{position:absolute; top:-8%; opacity:0; animation:fall linear infinite;}
  .petal svg{width:100%;height:100%;display:block;}
  @keyframes fall{
    0%{transform:translateY(0) translateX(0) rotate(0deg); opacity:0;}
    8%{opacity:.8;}
    90%{opacity:.55;}
    100%{transform:translateY(310px) translateX(var(--drift,20px)) rotate(300deg); opacity:0;}
  }

  .message{
    padding-top:10px;
  }
  .label{
    font-style:italic;
    font-size:.95rem;
    color:var(--ink-soft);
    margin:0 0 10px;
    opacity:0;
    animation:fadeUp .9s ease forwards;
    animation-delay:2.5s;
  }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  .counter{
    font-size:.88rem;
    line-height:1.55;
    color:var(--ink);
    margin:0;
    opacity:0;
    animation:fadeUp .9s ease forwards;
    animation-delay:2.8s;
  }
  .counter .nowrap{ white-space:nowrap; display:inline-block; }
  .counter b{
    font-size:1.22rem;
    color:var(--rose-1);
    font-weight:700;
  }

  @media (prefers-reduced-motion: reduce){
    .branch,.trunk-shape,.flower,.petal,.bg-heart,.label,.counter{animation:none !important; opacity:1 !important; stroke-dashoffset:0 !important; transform:none !important;}
  }

  @media (max-width:380px){
    .card{padding:32px 18px 22px; border-radius:26px;}
    .scene{height:250px;}
    .flowers{width:215px; height:196px; bottom:64px;}
  }
</style>
</head>
<body>

  <div class="bg-hearts" id="bgHearts"></div>

  <div class="card">
    <div class="scene">
      <svg class="tree-svg" width="168" height="178" viewBox="0 0 168 178">
        <defs>
          <linearGradient id="trunkGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#8a5a26"/>
            <stop offset="100%" stop-color="#5c3413"/>
          </linearGradient>
        </defs>
        <path class="trunk-shape" d="M78 170 L74 96 Q84 92 94 96 L90 170 Z"/>
        <path class="branch" d="M84 98 C 74 78, 58 68, 42 52" style="animation-delay:.28s"/>
        <path class="branch" d="M84 98 C 94 78, 110 68, 128 52" style="animation-delay:.36s"/>
        <path class="branch" d="M84 98 C 82 74, 84 52, 80 26" style="animation-delay:.44s"/>
        <path class="branch" d="M84 98 C 68 84, 52 82, 36 84" style="animation-delay:.5s"/>
        <path class="branch" d="M84 98 C 100 84, 116 82, 132 86" style="animation-delay:.5s"/>
      </svg>

      <div class="flowers" id="flowers"></div>
      <div class="ground"></div>
      <div class="petals" id="petals"></div>
    </div>

    <div class="message">
      <p class="label">Mi amor por ti comenzó hace...</p>
      <p class="counter" id="counterText"></p>
    </div>
  </div>

<script>
/* ---------- flower icon templates (viewBox 0 0 24 24) ---------- */
const FLOWER_SVGS = {
  sunflower: `<svg viewBox="0 0 24 24">
    <g fill="#f7c531">
      <ellipse cx="12" cy="4.2" rx="2.1" ry="4"/>
      <ellipse cx="12" cy="19.8" rx="2.1" ry="4"/>
      <ellipse cx="4.2" cy="12" rx="4" ry="2.1"/>
      <ellipse cx="19.8" cy="12" rx="4" ry="2.1"/>
      <ellipse cx="6.6" cy="6.6" rx="2.1" ry="3.8" transform="rotate(45 6.6 6.6)"/>
      <ellipse cx="17.4" cy="6.6" rx="2.1" ry="3.8" transform="rotate(-45 17.4 6.6)"/>
      <ellipse cx="6.6" cy="17.4" rx="2.1" ry="3.8" transform="rotate(-45 6.6 17.4)"/>
      <ellipse cx="17.4" cy="17.4" rx="2.1" ry="3.8" transform="rotate(45 17.4 17.4)"/>
    </g>
    <circle cx="12" cy="12" r="4" fill="#3c220c"/>
    <circle cx="12" cy="12" r="4" fill="#000" opacity="0"/>
  </svg>`,
  rose: `<svg viewBox="0 0 24 24">
    <path d="M12 3.4c4.1 1.3 6.5 4.5 6.5 8.5 0 4.2-2.9 7.5-6.5 7.5s-6.5-3.3-6.5-7.5c0-4 2.4-7.2 6.5-8.5z" fill="#9c1238"/>
    <path d="M12 6.3c2.7 1 4.4 3.3 4.4 6 0 2.8-2 5.1-4.4 5.1s-4.4-2.3-4.4-5.1c0-2.7 1.7-5 4.4-6z" fill="#d23659"/>
    <path d="M12 9c1.5.7 2.5 2.1 2.5 3.7 0 1.7-1.1 3.1-2.5 3.1s-2.5-1.4-2.5-3.1C9.5 11.1 10.5 9.7 12 9z" fill="#f06d86"/>
  </svg>`,
  tulip: `<svg viewBox="0 0 24 24">
    <path d="M12 2.3c-1.8 2.1-3.4 4.4-3.4 7.1a3.4 3.4 0 006.8 0c0-2.7-1.6-5-3.4-7.1z" fill="#b3185c"/>
    <path d="M9 8.5c-2.3.8-4.2 2.8-4.2 5.5a3.8 3.8 0 003.8 3.8c1.1 0 2-.4 2.6-1.1-1.4-1-2.3-2.8-2.3-4.7 0-1.2.3-2.4.1-3.5z" fill="#e2497f"/>
    <path d="M15 8.5c2.3.8 4.2 2.8 4.2 5.5a3.8 3.8 0 01-3.8 3.8c-1.1 0-2-.4-2.6-1.1 1.4-1 2.3-2.8 2.3-4.7 0-1.2-.3-2.4-.1-3.5z" fill="#e2497f"/>
  </svg>`
};
const FLOWER_TYPES = ['sunflower','rose','tulip'];

/* ---------- heart point generator (implicit heart curve, filled) ---------- */
function buildHeartPoints(){
  const pts = [];
  const step = 0.18;
  for(let x=-1.3; x<=1.3; x+=step){
    for(let y=-1.2; y<=1.3; y+=step){
      const v = (x*x + y*y - 1);
      const val = v*v*v - x*x*y*y*y;
      if(val <= 0){
        pts.push({
          x: x + (Math.random()-0.5)*step*0.65,
          y: y + (Math.random()-0.5)*step*0.65
        });
      }
    }
  }
  return pts;
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

function renderFlowers(){
  const container = document.getElementById('flowers');
  let pts = shuffle(buildHeartPoints());
  const usable = pts.length - (pts.length % 3); // keep counts perfectly equal
  pts = pts.slice(0, usable);
  pts.forEach((p,i)=> p.type = FLOWER_TYPES[i % 3]);
  pts.sort((a,b)=> a.y - b.y); // bloom bottom (trunk) -> top (lobes)

  const w = container.clientWidth, h = container.clientHeight;
  pts.forEach((p,i)=>{
    const el = document.createElement('div');
    el.className = 'flower';
    el.innerHTML = FLOWER_SVGS[p.type];
    const size = 16 + Math.random()*9;
    el.style.width = size+'px';
    el.style.height = size+'px';
    const left = ((p.x + 1.35) / 2.7) * w;
    const top  = ((1.35 - p.y) / 2.7) * h;
    el.style.left = left+'px';
    el.style.top = top+'px';
    el.style.setProperty('--rot', (Math.random()*40-20)+'deg');
    el.style.animationDelay = (0.15 + i*0.011) + 's';
    container.appendChild(el);
  });
}
renderFlowers();

/* ---------- falling petals ---------- */
function renderPetals(){
  const container = document.getElementById('petals');
  for(let i=0;i<12;i++){
    const el = document.createElement('div');
    el.className = 'petal';
    el.innerHTML = FLOWER_SVGS[FLOWER_TYPES[i % 3]];
    const size = 9 + Math.random()*7;
    el.style.width = size+'px';
    el.style.height = size+'px';
    el.style.left = (Math.random()*92+2)+'%';
    el.style.setProperty('--drift', (Math.random()*60-30)+'px');
    el.style.animationDuration = (7+Math.random()*6)+'s';
    el.style.animationDelay = (-Math.random()*13)+'s';
    container.appendChild(el);
  }
}
renderPetals();

/* ---------- ambient background hearts ---------- */
function renderBgHearts(){
  const container = document.getElementById('bgHearts');
  const heartSVG = `<svg viewBox="0 0 32 29" width="100%" height="100%"><path d="M16 28S2 18.5 2 9.8C2 4.9 5.8 1.5 10.2 1.5c2.7 0 5 1.3 5.8 3.4.8-2.1 3.1-3.4 5.8-3.4C26.2 1.5 30 4.9 30 9.8 30 18.5 16 28 16 28z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>`;
  for(let i=0;i<14;i++){
    const el = document.createElement('div');
    el.className = 'bg-heart';
    el.innerHTML = heartSVG;
    const size = 16+Math.random()*26;
    el.style.width = size+'px';
    el.style.height = (size*0.9)+'px';
    el.style.left = (Math.random()*100)+'%';
    el.style.bottom = (-10 - Math.random()*20)+'%';
    el.style.animationDuration = (14+Math.random()*16)+'s';
    el.style.animationDelay = (-Math.random()*22)+'s';
    container.appendChild(el);
  }
}
renderBgHearts();

/* ---------- live counter: 1709 días desde el 14 de octubre de 2021, y contando ---------- */
const startDate = new Date(2021, 9, 14, 0, 0, 0); // 14 oct 2021
function pad(n){ return String(n).padStart(2,'0'); }
function updateCounter(){
  const now = new Date();
  let diff = Math.floor((now - startDate)/1000);
  if(diff < 0) diff = 0;
  const days = Math.floor(diff/86400);
  const hours = Math.floor((diff%86400)/3600);
  const minutes = Math.floor((diff%3600)/60);
  const seconds = diff%60;
  document.getElementById('counterText').innerHTML =
    `<span class="nowrap"><b>${days}</b> días</span> ` +
    `<span class="nowrap">${pad(hours)} horas</span> ` +
    `<span class="nowrap">${pad(minutes)} minutos</span> ` +
    `<span class="nowrap">${pad(seconds)} segundos</span>`;
}
updateCounter();
setInterval(updateCounter, 1000);
</script>
</body>
</html>
